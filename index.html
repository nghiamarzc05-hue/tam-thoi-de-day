<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards UI</title>

<style>
body{margin:0;font-family:system-ui;background:#f4f7fb}
.container{max-width:420px;margin:auto;padding:18px;padding-bottom:90px}

/* HEADER */
.top{display:flex;align-items:center;gap:10px}
.logo{width:46px;height:46px;border-radius:12px;background:linear-gradient(#2b8ff6,#36a8ff);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.search{flex:1;background:#fff;border-radius:999px;padding:8px 12px}
.search input{border:0;outline:none;width:100%}

/* HERO */
h1{margin:14px 0 0;font-size:28px}
.sub{color:#777;margin-bottom:14px}

/* CARD */
.card{background:#fff;border-radius:18px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.deck{background:linear-gradient(90deg,#2b8ff6,#4fc3f7);color:#fff;padding:12px;border-radius:14px;font-weight:700}
.btn{padding:12px;border-radius:14px;border:0;font-weight:700;cursor:pointer}
.primary{background:#2b9df4;color:white}
.ghost{background:#eee}

/* QUICK */
.quick{display:flex;gap:12px;margin-top:16px}
.quick div{flex:1;padding:18px;border-radius:16px;color:white;font-weight:700}
.manual{background:linear-gradient(90deg,#2b8ff6,#2b9df4)}
.auto{background:linear-gradient(90deg,#2bd1b0,#41d3b7)}

/* LIBRARY */
.lib{display:flex;gap:10px;overflow:auto;margin-top:10px}
.lib div{min-width:120px;background:#fff;padding:10px;border-radius:12px;box-shadow:0 10px 20px rgba(0,0,0,.06);cursor:pointer}

/* BOTTOM NAV */
.bottom{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:420px;max-width:100%;padding:8px}
.nav{background:#fff;border-radius:28px;padding:10px;display:flex;justify-content:space-between;box-shadow:0 15px 40px rgba(0,0,0,.15)}
.nav div{font-size:12px;color:#777;text-align:center}
.active{color:#2b9df4;font-weight:700}

/* MODAL QUIZ */
#quiz{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center}
.quizbox{background:white;padding:20px;border-radius:16px;width:90%;max-width:380px;text-align:center}
.front{font-size:22px;font-weight:700}
.back{margin-top:10px;color:#444;display:none}
</style>
</head>

<body>

<div class="container">

<div class="top">
<div class="logo">EN</div>
<div class="search"><input placeholder="Tìm từ / deck..."></div>
</div>

<h1>Welcome Back!</h1>
<div class="sub">Ready to continue learning?</div>

<div class="card">
<div class="deck" id="deckName">Tất cả thẻ</div>
<div id="count">0 cards left</div>
<br>
<button class="btn primary" onclick="startQuiz()">Continue</button>
<button class="btn ghost" onclick="manage()">Manage</button>
</div>

<div class="quick">
<div class="manual" onclick="startQuiz()">Học thủ công</div>
<div class="auto" onclick="startQuiz()">Học tự động</div>
</div>

<h3>Library</h3>
<div class="lib" id="lib"></div>

</div>

<div class="bottom">
<div class="nav">
<div class="active">Trang chủ</div>
<div>Học</div>
<div>Ôn tập</div>
<div>Thư viện</div>
<div>Cài đặt</div>
</div>
</div>

<!-- QUIZ -->
<div id="quiz">
<div class="quizbox">
<div class="front" id="front"></div>
<div class="back" id="back"></div>
<br>
<button class="btn ghost" onclick="reveal()">Reveal</button>
<button class="btn primary" onclick="next()">Next</button>
<button class="btn" onclick="closeQuiz()">Quit</button>
</div>
</div>

<script>
const DATA=[
{en:"apple",vi:"quả táo"},
{en:"dog",vi:"con chó"},
{en:"cat",vi:"con mèo"},
{en:"car",vi:"xe hơi"},
{en:"book",vi:"quyển sách"}
]

let i=0

function renderLib(){
const lib=document.getElementById("lib")
DATA.forEach(w=>{
let d=document.createElement("div")
d.innerHTML=w.en
d.onclick=()=>alert(w.vi)
lib.appendChild(d)
})
document.getElementById("count").innerText=DATA.length+" cards left"
}
renderLib()

function startQuiz(){
i=0
document.getElementById("quiz").style.display="flex"
show()
}
function show(){
document.getElementById("front").innerText=DATA[i].en
document.getElementById("back").innerText=DATA[i].vi
document.getElementById("back").style.display="none"
}
function reveal(){document.getElementById("back").style.display="block"}
function next(){i++;if(i>=DATA.length){alert("Xong!");closeQuiz()}else show()}
function closeQuiz(){document.getElementById("quiz").style.display="none"}
function manage(){alert("Manage decks (demo)")}
</script>

</body>
</html>
