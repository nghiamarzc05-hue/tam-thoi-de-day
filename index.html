<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Pro - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="user-info">
                <h1>Welcome Back!</h1>
                <p>Ready to continue learning?</p>
            </div>
            <div class="streak-badge">
                <i class="fas fa-fire"></i> <span>12</span>
            </div>
        </header>

        <section class="section">
            <h2 class="section-title">Continue Learning</h2>
            <div class="main-card">
                <div class="card-content">
                    <div class="icon-box">
                        <i class="fas fa-book-open"></i>
                    </div>
                    <div class="text-group">
                        <h3>English Vocabulary</h3>
                        <p>Manual Mode • 12 cards left</p>
                    </div>
                </div>
                <button class="btn-primary">Continue</button>
            </div>
        </section>

        <section class="section">
            <h2 class="section-title">Quick Start</h2>
            <div class="grid-2">
                <div class="action-card bg-blue">
                    <i class="fas fa-hand-pointer"></i>
                    <span>Learn Manually</span>
                </div>
                <div class="action-card bg-green">
                    <i class="fas fa-play-circle"></i>
                    <span>Learn Automatically</span>
                </div>
            </div>
        </section>

        <section class="section">
            <h2 class="section-title">Today's Focus</h2>
            <div class="grid-2">
                <div class="focus-card">
                    <span class="focus-label">Learn New Words</span>
                    <span class="focus-count">10 words</span>
                </div>
                <div class="focus-card">
                    <span class="focus-label">Review Words</span>
                    <span class="focus-count">6 to review</span>
                </div>
            </div>
        </section>

        <nav class="bottom-nav">
            <div class="nav-item active"><i class="fas fa-home"></i><span>Home</span></div>
            <div class="nav-item"><i class="fas fa-graduation-cap"></i><span>Learn</span></div>
            <div class="nav-item"><i class="fas fa-history"></i><span>Review</span></div>
            <div class="nav-item"><i class="fas fa-layer-group"></i><span>Library</span></div>
            <div class="nav-item"><i class="fas fa-cog"></i><span>Settings</span></div>
        </nav>
    </div>
</body>
</html>
